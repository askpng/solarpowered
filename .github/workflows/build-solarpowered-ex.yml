name: Build solarpowered-ex
on:
  schedule:
      - cron: "30 5 * * 2,4,6"
        timezone: "Etc/UTC"
    
  push:
    paths:
      - ".github/workflows/build-solarpowered-ex.yml"
      - "recipes/images/solarpowered-ex.yml"
      - "recipes/packages/solarpowered-ex.yml"
      
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  bluebuild:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        recipe:
          - images/solarpowered-ex.yml
    steps:
      - name: Optimize build times
        shell: bash
        run: |
          echo 'set man-db/auto-update false' | sudo debconf-communicate
          sudo dpkg-reconfigure man-db
          sudo rm -f /var/lib/man-db/auto-update
      #     sudo sed -i 's/^update_initramfs=.*/update_initramfs=no/' /etc/initramfs-tools/update-initramfs.conf

      - name: Build solarpowered-ex
        uses: blue-build/github-action@v1.14
        with:
          recipe: ${{ matrix.recipe }}
          chunkah: true
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: true
          retry_push_count: 3
          # cli_version: v0.9.41

  # generate_release:
